name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project iPhoneCam.xcodeproj \
            -scheme iPhoneCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          mkdir Payload
          cp -R iPhoneCam.app Payload/
          zip -qr iPhoneCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iPhoneCam-ipa
          path: ios/build/Build/Products/Release-iphoneos/iPhoneCam.ipa
